<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>银河奶牛放置迷宫配装模拟器</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="./js/theme.js"></script>
</head>
<body>
  <header class="hero">
    <div class="hero__inner">
      <h1>迷宫配装模拟器</h1>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="切换为明亮主题" title="切换为明亮主题"><span aria-hidden="true">☀</span><span>明亮</span></button>
    </div>
  </header>

  <main class="shell">
    <details id="data-panel" class="panel collapsible-panel import-panel" open>
      <summary class="section-heading"><span class="step">1</span><strong id="import-title">加载数据</strong><span class="collapse-label"></span></summary>
      <div class="panel-content">
        <div id="bridge-status" class="bridge-status">正在等待数据桥接…</div>
        <div class="file-grid">
          <label class="file-card" id="character-card"><span class="file-card__title">角色数据</span><span class="file-card__hint">init_character_data.json</span><input id="character-file" type="file" accept="application/json,.json"><span class="file-card__status" id="character-status">尚未读取</span></label>
          <label class="file-card" id="client-card"><span class="file-card__title">游戏数据</span><span class="file-card__hint">init_client_data_v*.json</span><input id="client-file" type="file" accept="application/json,.json"><span class="file-card__status" id="client-status">尚未读取</span></label>
        </div>
        <div id="data-summary" class="data-summary" hidden></div>
      </div>
    </details>

    <details id="scope-panel" class="panel collapsible-panel" open>
      <summary class="section-heading"><span class="step">2</span><strong id="targets-title">模拟范围</strong><span class="collapse-label"></span></summary>
      <div class="panel-content subsection-stack">
        <details id="monster-scope" class="subsection" open><summary>迷宫怪物</summary><div class="subsection-content"><div class="choice-toolbar"><button type="button" class="text-button" data-select-all="monsters">全选</button><button type="button" class="text-button" data-clear-all="monsters">清空</button></div><div id="monster-options" class="choice-grid monster-choice-grid"></div></div></details>
        <details id="equipment-scope" class="subsection"><summary>装备部位</summary><div class="subsection-content"><div class="choice-toolbar"><button type="button" class="text-button" data-select-all="equipment">全选</button><button type="button" class="text-button" data-clear-all="equipment">清空</button></div><div id="equipment-options" class="choice-grid equipment-choice-grid"></div></div></details>
        <details id="skill-scope" class="subsection"><summary>技能类别</summary><div class="subsection-content"><div class="choice-toolbar"><button type="button" class="text-button" data-select-all="skills">全选</button><button type="button" class="text-button" data-clear-all="skills">清空</button></div><div id="skill-options" class="choice-grid skill-choice-grid"></div></div></details>
        <details id="fixed-rules-panel" class="subsection"><summary>固定技能</summary><div class="subsection-content"><p id="fixed-rules-status" class="compact-note"></p><div id="fixed-skill-rules"></div></div></details>
      </div>
    </details>

    <details id="settings-panel" class="panel collapsible-panel" open>
      <summary class="section-heading"><span class="step">3</span><strong id="settings-title">模拟设置</strong><span class="collapse-label"></span></summary>
      <div class="panel-content">
        <div class="settings-grid">
          <label>参考等级<input id="reference-monster-level" type="number" min="20" max="5000" value="240"></label>
          <label>等级下限<input id="min-monster-level" type="number" min="1" max="5000" value="20"></label>
          <label>等级上限<input id="max-monster-level" type="number" min="1" max="5000" value="300"></label>
          <label>目标胜率<input id="target-rate" type="number" min="1" max="99" value="70"><span class="suffix">%</span></label>
          <label>预设配装<select id="equipment-preset-source"><option value="system" selected>系统预设配装</option><option value="personal">个人预设配装</option></select></label>
          <label>并行怪物数<select id="parallel-count"></select></label>
          <label>测试次数<input id="test-trials" type="number" min="10" max="10000" step="10" value="100"></label>
          <label>复核次数<input id="review-trials" type="number" min="10" max="10000" step="10" value="300"></label>
          <label>优化次数<input id="optimize-trials" type="number" min="10" max="10000" step="10" value="500"></label>
        </div>
      </div>
    </details>

    <section class="run-panel" aria-label="开始模拟">
      <button id="start-button" class="primary-button" disabled>开始全量模拟</button>
      <button id="pause-button" class="secondary-button" hidden>暂停</button>
      <button id="cancel-button" class="secondary-button" hidden>停止</button>
      <div class="run-status" id="run-status">请先加载两份数据</div>
      <div class="run-note" id="audit-status" hidden></div>
      <div class="progress-track" id="progress-track" hidden><div id="progress-bar"></div></div>
    </section>

    <section id="results-section" class="results" hidden aria-labelledby="results-title">
      <div class="results-heading"><h2 id="results-title">配装结果</h2><div class="results-actions"><button id="export-audit-button" class="secondary-button" disabled>下载模拟明细</button><button id="export-loadout-button" class="secondary-button">导出配装总表</button><button id="export-button" class="secondary-button">导出完整报告</button></div></div>
      <details id="summary-report" class="report-block" open><summary>全部怪物配装总表</summary><div id="loadout-summary" class="loadout-summary"></div></details>
      <details id="detail-report" class="report-block" open><summary>单怪物详细报告</summary><div class="report-block-content"><div id="monster-tabs" class="monster-tabs" role="tablist"></div><article id="monster-detail" class="panel result-detail"></article></div></details>
    </section>
  </main>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
