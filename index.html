<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'"><title>迷宫模拟器</title><link rel="stylesheet" href="styles.css"><script src="js/theme.js"></script></head>
<body><main>
<header><h1>迷宫模拟器</h1><button id="theme-toggle" type="button">主题</button></header>
<section id="configuration">
<section class="panel"><div class="imports"><label class="file">导入角色<input id="character-file" type="file" accept=".json"><span id="character-status">未导入</span></label><label class="file">导入游戏数据<input id="client-file" type="file" accept=".json"><span id="client-status">未导入</span></label></div><p id="data-status" role="status"></p><details id="character-editor" hidden></details></section>
<details class="panel" id="scope-panel"><summary>模拟范围<span id="scope-summary"></span></summary><div class="content"><div class="toolbar"><button data-all="true">全选</button><button data-all="false">清空</button></div><div id="monster-options" class="monsters"></div><h3>轮换部位</h3><div id="equipment-options" class="choices"></div><h3>技能</h3><div class="choices"><label><input id="aura" type="checkbox" checked>特殊技能</label><label><input id="active" type="checkbox" checked>主动技能</label></div><label>预设<select id="preset"><option value="system">系统预设</option><option value="personal">个人预设</option></select></label><details><summary>固定技能</summary><div id="fixed-rules" class="content"></div></details></div></details>
<details class="panel" id="settings-panel"><summary>模拟设置<span>最多尝试两次</span></summary><div class="content grid"><label>最低等级<input id="minimum" type="number" min="20" max="5000" value="200"></label><label>最高等级<input id="maximum" type="number" min="20" max="5000" value="300"></label><label>单场目标胜率 %<input id="target" type="number" min="1" max="99" value="70"></label><label>资源占用<select id="resource"><option value="50">50%</option><option value="80" selected>80%</option><option value="100">100%</option></select></label><label>粗筛场数<input id="screen-trials" type="number" min="10" max="10000" step="10" value="100"></label><label>等级测试场数<input id="level-trials" type="number" min="10" max="10000" step="10" value="1000"></label><label>最终复核场数<input id="final-trials" type="number" min="10" max="100000" step="10" value="5000"></label></div></details>
</section>
<section class="panel run"><div class="toolbar"><button class="primary" id="start" disabled>开始模拟</button><button id="resume" disabled>恢复任务</button><button id="preview" disabled>预览候选</button><button id="pause" hidden>暂停</button><button id="stop" hidden>停止</button></div><p id="run-status" role="status">请导入数据</p><progress id="progress" max="1" value="0" hidden></progress><small id="run-time"></small></section>
<section id="preview-panel" class="panel" hidden></section>
<section id="results" class="panel" hidden><div class="toolbar"><h2>达标方案</h2><button id="export">导出结果</button><button id="audit">导出明细</button></div><div id="result-tabs" class="toolbar"></div><div id="result-body"></div></section>
<footer><details><summary>说明</summary><p>每种怪物独立搜索，在楼层边界和共同等级比较高度与速度。房间最多尝试两次，每次失败按120秒计时。通过概率为独立重试估计，有限样本不能保证最优。</p><p>建议等级用于设置游戏挑战阈值。更新版本后需开始新任务。</p><button id="clear">清除本机任务</button></details><span>052</span></footer>
</main><script type="module" src="js/app.js"></script></body></html>
